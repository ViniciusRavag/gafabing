<!-- ============ FIREBASE SDK (via CDN) ============ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  // 🔥 COLE AQUI SEU firebaseConfig (copiado do console do Firebase)
  const firebaseConfig = {
  apiKey: "AIzaSyBBA3JSkM0Kex62L2me_JFU8x3RfAgW-dE",
  authDomain: "bingo-gafa.firebaseapp.com",
  projectId: "bingo-gafa",
  storageBucket: "bingo-gafa.firebasestorage.app",
  messagingSenderId: "1068209310638",
  appId: "1:1068209310638:web:ef2cfdc9650e4fbeac963f"
};

  // Inicializa Firebase e Firestore
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // Documento único que guarda todo o estado do bingo
  const bingoRef = doc(db, "bingo_sessions", "main");

  // Expose para o script principal
  window.firebaseAPI = { db, bingoRef, setDoc, onSnapshot, serverTimestamp };
</script>

<style>
/* ... TODO O SEU CSS ORIGINAL VEM AQUI (sem mudanças) ... */
:root{
  --brand:#F8811C;
  --brand-dark:#c56200;
  --ink:#1a1a1a;
  --tabbar-h:54px;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f0f0f0;color:var(--ink);
  -webkit-text-size-adjust:100%;
}
button,select,input{font-family:inherit;}
button{touch-action:manipulation;cursor:pointer;}
img,svg{max-width:100%;}

#bingo-app{
  width:100%;
  height:100vh;
  height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
}

.tabbar{
  display:flex;flex-shrink:0;background:#fff;
  border-bottom:2px solid var(--ink);
  padding-top:env(safe-area-inset-top);
}
.tab{
  flex:1;min-height:var(--tabbar-h);
  padding:12px 8px;border:none;background:#e8e8e8;color:#666;
  font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px;
  transition:background .15s,color .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.tab + .tab{border-left:2px solid var(--ink);}
.tab:hover{background:#ddd;}
.tab.active{background:var(--brand);color:#fff;}
.tab:active{transform:scale(.99);}

.panel{display:none;flex:1;min-height:0;overflow:hidden;}
.panel.active{display:flex;}

#panel-org.active{flex-direction:row;}
.org-left,.org-right{
  padding:20px;display:flex;flex-direction:column;min-width:0;
  overscroll-behavior:contain;
}
.org-left{flex:1;gap:16px;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));}
.org-right{flex:1;gap:10px;background:#fff;border-left:2px solid #ddd;overflow:hidden;}

.card{background:#fff;border:1px solid #ddd;border-radius:var(--radius);padding:18px;flex-shrink:0;}
.card-title{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:12px;}

.row{display:flex;gap:10px;align-items:center;}
.row label{font-size:13px;color:#555;min-width:90px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.row select{
  flex:1;min-width:0;padding:12px;border-radius:10px;border:1.5px solid #ccc;
  background:#fff;font-size:15px;font-weight:600;color:var(--ink);
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;
  padding-right:38px;
}

.prizebox{text-align:center;padding:16px;border-radius:10px;background:#fff8f1;border:2px dashed var(--brand);margin-top:12px;}
.prizebox h2{margin:0;font-size:17px;font-weight:700;color:var(--ink);line-height:1.3;}
.org-banner-preview{width:100%;max-width:440px;height:auto;display:block;margin:12px auto 0;background:#fff;border:1px solid #eee;border-radius:10px;}

.ctrl{display:flex;gap:10px;flex-wrap:wrap;}
.ctrl button{
  flex:1 1 140px;min-height:52px;padding:14px 18px;border-radius:10px;
  border:2px solid #ddd;background:#fff;font-weight:700;font-size:14px;
  text-transform:uppercase;letter-spacing:.5px;transition:background .12s,border-color .12s,transform .08s;
}
.ctrl button:hover{background:#fff4ea;border-color:var(--brand);}
.ctrl button:active{transform:scale(.98);}
.ctrl button:disabled{opacity:.4;cursor:not-allowed;}
.ctrl button.warn{background:#fef2f2;color:#dc2626;border-color:#dc2626;}
.ctrl button.warn:hover{background:#fee2e2;}

.bigball-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.bigball{
  width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#ffd9a6,#fb9a3e 35%,var(--brand) 62%,var(--brand-dark) 100%);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 10px 20px rgba(0,0,0,.28),inset -6px -10px 16px rgba(0,0,0,.15);
}
.bigball.empty{background:radial-gradient(circle at 32% 28%,#f2f2f2,#dcdcdc 40%,#c4c4c4 100%);}
.bigball.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1);}
.bb-disc{width:66%;aspect-ratio:1;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.bigball-letter{font-size:12px;font-weight:800;color:#e07000;letter-spacing:2px;line-height:1;}
.bigball-number{font-size:30px;font-weight:800;color:#111;line-height:1;font-variant-numeric:tabular-nums;}
.bigball-info{display:flex;flex-direction:column;gap:4px;min-width:0;}
.bigball-info .lbl{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.bigball-info .cnt{font-size:14px;color:#888;font-weight:600;}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.1)}100%{transform:scale(1)}}

.hist-wrap{flex:1;min-height:120px;display:flex;flex-direction:column;}
.hist-title{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px;}
.hist{display:flex;flex-wrap:wrap;gap:6px;overflow-y:auto;align-content:flex-start;min-height:40px;}
.hist span{padding:7px 11px;border-radius:8px;background:#eee;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.hist span.recent{background:var(--brand);color:#fff;}
.hist .empty-hint{background:none;color:#aaa;font-weight:600;padding:7px 2px;}

.org-grid-head{flex-shrink:0;display:flex;flex-direction:column;gap:10px;}

.m-summary{display:none;}

.grid-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.grid-labels div{
  text-align:center;font-size:22px;font-weight:800;padding:8px 0;min-height:40px;
  background:var(--ink);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;
}

.grid75{
  display:grid;grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(15,minmax(26px,1fr));
  grid-auto-flow:column;gap:6px;flex:1;min-height:0;overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.grid-cell{
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;border:2px solid #e0e0e0;background:#f8f8f8;color:#444;
  font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:background .12s,transform .08s,border-color .12s,color .12s;
}
.grid-cell:not(.called):hover{background:#ffe8d1;border-color:var(--brand);}
.grid-cell:not(.called):active{transform:scale(.93);background:#ffd7ac;}
.grid-cell.called{background:var(--brand);color:#fff;border-color:var(--brand);}
.grid-cell.latest{box-shadow:0 0 0 3px var(--ink);z-index:1;}

#panel-screen.active{flex-direction:row;position:relative;background:var(--brand);color:var(--ink);overflow:hidden;}
#panel-screen::before{content:"";position:absolute;z-index:0;left:clamp(34px,3vw,70px);top:clamp(1px,1vh,1px);bottom:0;width:clamp(6px,.55vw,12px);background:#fff;}
#panel-screen::after{content:"";position:absolute;z-index:0;left:calc(-1 * clamp(1px,5vw,12px));top:calc(-1 * clamp(1px,2vh,1px));width:clamp(220px,17vw,400px);height:clamp(7px,6.5vh,2px);background:#fff;transform:rotate(-22deg);}

.deco{position:absolute;z-index:1;pointer-events:none;filter:drop-shadow(0 12px 16px rgba(0,0,0,.30));}
.deco svg, .deco img{display:block;width:100%;height:auto;}
.deco img{aspect-ratio:1/1;object-fit:contain;}
.deco-1{width:clamp(46px,4.5vw,102px);top:-2%;left:41.4%;transform:rotate(14deg);}
.deco-2{width:clamp(84px,8.4vw,190px);top:4%;left:42.4%;transform:rotate(-9deg);}
.deco-3{width:clamp(84px,8vw,176px);top:51%;left:-3.2%;transform:rotate(7deg) scaleX(-1);}


.screen-left,.screen-right{overflow:hidden;display:flex;flex-direction:column;position:relative;z-index:2;min-width:0;}
.screen-left{flex:1;padding:clamp(18px,3vh,40px) clamp(20px,3.4vw,44px) clamp(18px,3vh,40px) clamp(56px,6vw,120px);justify-content:center;gap:clamp(10px,2.2vh,26px);}
.screen-right{flex:1.08;padding:clamp(18px,3.4vh,42px) clamp(20px,2.2vw,42px) clamp(18px,3.4vh,42px) 0;justify-content:center;}

.screen-logos{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(8px,1.4vh,18px);}
.logo-bingo{width:clamp(130px,17vw,500px);}
.logo-bingo img,.logo-bingo svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.16));}

.lastnumber-circle{
  align-self:center;width:min(40vh,25vw);aspect-ratio:1;border-radius:50%;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(4px,1.2vh,14px);text-align:center;flex-shrink:0;
  box-shadow:0 16px 40px rgba(0,0,0,.20);
}
.lastnumber-circle.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
.ln-label{font-size:clamp(11px,1.45vw,26px);letter-spacing:.12em;color:#222;font-weight:600;}
.ln-value{font-size:clamp(40px,6.4vw,118px);font-weight:800;color:#0d0d0d;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.ln-sorteado{font-size:clamp(11px,1.45vw,26px);letter-spacing:.18em;color:#222;font-weight:600;}

.prize-banner{position:relative;z-index:1;width:100%;}
.prize-banner img,.prize-banner svg{display:block;width:100%;height:auto;max-height:36vh;object-fit:contain;border-radius:16px;background:transparent;}

.screen-grid-card{background:#fff;border-radius:22px;padding:clamp(14px,2.4vh,30px) clamp(14px,1.8vw,28px);flex:1;display:flex;flex-direction:column;min-height:0;box-shadow:0 14px 40px rgba(0,0,0,.22);}
.screen-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(15,minmax(0,1fr));grid-auto-flow:column;gap:clamp(4px,.9vh,10px);flex:1;min-height:0;}
.screen-grid .sgCell{display:flex;align-items:center;justify-content:center;font-size:clamp(9px,1.05vw,16px);border-radius:7px;background:#d9d9d9;font-weight:600;font-variant-numeric:tabular-nums;color:#9c9c9c;transition:background .15s,color .15s;}
.screen-grid .sgCell.on{background:var(--brand);color:#fff;font-weight:800;}
.screen-grid .sgCell.latestNew{box-shadow:0 0 0 3px #111;}

.modal-backdrop{
  position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal{
  background:#fff;border-radius:18px;padding:24px;width:100%;max-width:420px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);
  transform:translateY(14px) scale(.96);transition:transform .22s cubic-bezier(.34,1.4,.64,1);
}
.modal-backdrop.open .modal{transform:none;}
.modal h3{font-size:19px;font-weight:800;margin-bottom:8px;}
.modal p{font-size:14px;color:#555;line-height:1.5;margin-bottom:20px;}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;}
.m-btn{
  flex:1 1 150px;min-height:52px;border-radius:12px;border:2px solid #ddd;background:#fff;
  font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.5px;transition:all .12s;
}
.m-btn:active{transform:scale(.98);}
.m-btn.danger{background:#dc2626;border-color:#dc2626;color:#fff;}
.m-btn.danger:hover{background:#b91c1c;}
.m-btn.ghost:hover{background:#f4f4f4;}

.subnav{display:none;}
.subtab{
  flex:1;min-height:46px;border-radius:10px;border:2px solid #e2e2e2;background:#f4f4f4;
  font-weight:700;font-size:14px;color:#777;text-transform:uppercase;letter-spacing:.5px;
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;
}
.subtab.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(248,129,28,.35);}

/* Status bar de conexão */
#connStatus{
  position:fixed;top:8px;right:8px;z-index:500;
  padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;
  background:#10b981;color:#fff;letter-spacing:.5px;text-transform:uppercase;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  transition:background .2s;
}
#connStatus.offline{background:#dc2626;}
#connStatus.loading{background:#f59e0b;}

@media (max-width:900px){
  :root{--tabbar-h:50px;}
  .tab{font-size:12.5px;letter-spacing:.6px;}
  .subnav{
    display:flex;gap:8px;padding:10px 12px;background:#fff;
    border-bottom:1px solid #e3e3e3;flex-shrink:0;
  }
  #panel-org.active{flex-direction:column;}
  .org-left,.org-right{display:none;flex:1;min-height:0;overflow-y:auto;padding:12px;}
  #panel-org[data-view="ctrl"] .org-left,
  #panel-org[data-view="nums"] .org-right{display:flex;}
  .org-left{gap:12px;background:#f0f0f0;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  .org-right{border-left:none;background:#fff;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  .card{padding:14px;border-radius:14px;}
  .card-title{font-size:12px;margin-bottom:10px;}
  .row{flex-direction:column;align-items:stretch;gap:6px;}
  .row label{min-width:0;font-size:12px;}
  .row select{width:100%;font-size:16px;padding:14px 38px 14px 12px;}
  .prizebox{padding:12px;}
  .prizebox h2{font-size:15px;}
  .ctrl button{flex:1 1 100%;min-height:56px;font-size:15px;}
  .bigball-wrap{justify-content:center;gap:16px;}
  .bigball{width:92px;height:92px;}
  .bigball-number{font-size:27px;}
  .bigball-info{align-items:center;text-align:center;}
  .hist{max-height:none;}
  .hist span{font-size:14px;padding:8px 12px;}
  .hist-wrap{min-height:0;flex:0 0 auto;}
  .org-grid-head{
    position:sticky;top:0;z-index:20;background:#fff;
    margin:-12px -12px 12px;padding:10px 12px 8px;
    box-shadow:0 8px 18px rgba(0,0,0,.08);gap:8px;
  }
  .m-summary{display:flex;align-items:center;gap:10px;}
  .m-ball{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 32% 28%,#ffd9a6,#fb9a3e 35%,var(--brand) 62%,var(--brand-dark) 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.22),inset -3px -5px 8px rgba(0,0,0,.15);
  }
  .m-ball.empty{background:radial-gradient(circle at 32% 28%,#f5f5f5,#dcdcdc 45%,#c2c2c2 100%);box-shadow:0 3px 8px rgba(0,0,0,.15);}
  .m-ball.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1);}
  .m-ball-inner{width:68%;aspect-ratio:1;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;}
  .m-ball-letter{font-size:9px;font-weight:800;color:#e07000;letter-spacing:1.5px;}
  .m-ball-num{font-size:18px;font-weight:800;color:#111;font-variant-numeric:tabular-nums;}
  .m-meta{
    flex:1;min-width:0;text-align:left;background:none;border:none;padding:2px 0;
    display:flex;flex-direction:column;gap:2px;
  }
  .m-prize{
    font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .m-count{font-size:11.5px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;}
  .m-count b{color:var(--brand);}
  .m-undo{
    flex-shrink:0;min-height:46px;padding:0 14px;border-radius:11px;
    border:2px solid #ddd;background:#fff;color:#444;
    font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;
    transition:all .12s;
  }
  .m-undo:active{transform:scale(.95);background:#f4f4f4;}
  .m-undo:disabled{opacity:.35;}
  .m-undo svg{width:16px;height:16px;flex-shrink:0;}
  .grid-labels,.grid75{width:100%;max-width:540px;margin-inline:auto;}
  .grid-labels{gap:7px;}
  .grid-labels div{font-size:clamp(15px,4.2vw,20px);min-height:34px;padding:6px 0;border-radius:9px;}
  .grid75{
    flex:0 0 auto;overflow:visible;min-height:0;
    grid-template-rows:repeat(15,auto);gap:7px;
  }
  .grid-cell{
    aspect-ratio:1/1;min-height:52px;
    border-radius:13px;border-width:2px;
    font-size:clamp(17px,4.8vw,23px);font-weight:800;
    box-shadow:0 2px 0 rgba(0,0,0,.05);
  }
  .grid-cell.called{box-shadow:0 2px 0 rgba(197,98,0,.55);}
  .grid-cell.latest{box-shadow:0 0 0 4px var(--ink);}
  #panel-screen.active{flex-direction:column;overflow-y:auto;overscroll-behavior:contain;}
  #panel-screen::before,#panel-screen::after,.deco{display:none;}
  .screen-left{flex:0 0 auto;padding:18px 16px 14px;gap:14px;align-items:center;}
  .screen-logos{align-items:center;width:100%;}
  .logo-bingo{width:min(72vw,330px);}
  .lastnumber-circle{width:min(48vw,210px);gap:4px;}
  .ln-label,.ln-sorteado{font-size:clamp(9px,2.9vw,13px);}
  .ln-value{font-size:clamp(38px,13vw,62px);}
  .prize-banner img,.prize-banner svg{max-height:26vh;border-radius:12px;}
  .screen-right{flex:0 0 auto;padding:0 12px calc(20px + env(safe-area-inset-bottom));width:100%;}
  .screen-grid-card{border-radius:18px;padding:12px;}
  .screen-grid{grid-template-rows:repeat(15,minmax(21px,auto));gap:5px;flex:0 0 auto;}
  .screen-grid .sgCell{aspect-ratio:auto;min-height:21px;border-radius:6px;font-size:clamp(10px,2.9vw,14px);}
}

@media (max-width:900px) and (orientation:landscape){
  #panel-screen.active{flex-direction:row;overflow:hidden;}
  .screen-left{flex:1;padding:10px 14px;gap:8px;align-items:stretch;}
  .screen-logos{align-items:flex-start;}
  .logo-bingo{width:min(24vw,180px);}
  .lastnumber-circle{width:min(26vh,150px);align-self:center;}
  .ln-value{font-size:clamp(26px,5.4vh,44px);}
  .prize-banner img,.prize-banner svg{max-height:15vh;}
  .screen-right{flex:1.15;padding:10px 12px 10px 0;}
  .screen-grid-card{padding:10px;}
  .screen-grid{grid-template-rows:repeat(15,minmax(0,1fr));flex:1;gap:3px;}
  .screen-grid .sgCell{min-height:0;font-size:clamp(7px,1.35vw,12px);border-radius:4px;}
}

@media (max-width:380px){
  .m-undo span{display:none;}
  .m-undo{padding:0 12px;}

const LOGO_FALLBACK_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160">
  <g font-family="Montserrat, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <g transform="rotate(-8 34 56)"><rect x="8" y="30" width="52" height="52" rx="6" fill="#fff"/><text x="34" y="69" font-size="38" fill="#F8811C">B</text></g>
    <g transform="rotate(7 78 51)"><rect x="62" y="22" width="32" height="58" rx="6" fill="#fff"/><text x="78" y="64" font-size="36" fill="#F8811C">I</text></g>
    <g transform="rotate(4 124 54)"><rect x="96" y="26" width="56" height="56" rx="6" fill="#fff"/><text x="124" y="68" font-size="40" fill="#F8811C">N</text></g>
    <g transform="rotate(-6 178 60)"><rect x="154" y="36" width="48" height="48" rx="6" fill="#fff"/><text x="178" y="72" font-size="36" fill="#F8811C">G</text></g>
    <g transform="rotate(3 235 49)"><rect x="204" y="18" width="62" height="62" rx="6" fill="#fff"/><text x="235" y="66" font-size="46" fill="#F8811C">O</text></g>
    <g transform="rotate(-2.5 165 121)"><rect x="40" y="95" width="250" height="52" rx="8" fill="#fff"/><text x="165" y="133" font-size="34" fill="#F8811C">Mamma Mia!</text></g>
  </g>
</svg>`;

// ===== UTILITÁRIOS =====
const svgUri = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escAttr = s => esc(s).replace(/"/g,'&quot;');
const $ = id => document.getElementById(id);
function wrapText(s, max){
  const words = s.split(' '); const out = []; let cur = '';
  for(const w of words){
    if((cur + ' ' + w).trim().length > max){ if(cur) out.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  }
  if(cur) out.push(cur);
  return out.slice(0,3);
}
function replayPop(el){
  if(!el) return;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function fallbackBannerSVG(p, idx, cartela){
  const lines = wrapText(p.name.toUpperCase(), 26);
  const tspans = lines.map((ln,i)=>`<tspan x="210" dy="${i?46:0}">${esc(ln)}</tspan>`).join('');
  const bw = cartela.label.length * 15 + 44;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250">
    <rect width="900" height="250" rx="24" fill="#ffffff"/>
    <svg x="26" y="45" width="160" height="160" viewBox="0 0 100 100">${ICONS[p.art] || ''}</svg>
    <text x="210" y="82" font-family="Montserrat, Arial, sans-serif" font-style="italic" font-weight="600" font-size="32" fill="#111">Rodada ${idx+1}</text>
    <g transform="translate(375,48) skewX(-8)">
      <rect width="${bw}" height="44" rx="10" fill="${cartela.color}"/>
      <text x="${bw/2}" y="30" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-style="italic" font-weight="600" font-size="24" fill="#fff">${esc(cartela.label)}</text>
    </g>
    <text x="210" y="152" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="38" fill="#141414" letter-spacing="1">${tspans}</text>
  </svg>`;
}

// =====================================================================
// ===== ESTADO =====
// =====================================================================
const letters = ["B","I","N","G","O"];
const ranges  = [[1,15],[16,30],[31,45],[46,60],[61,75]];

// Estado local (sempre sincronizado com o Firebase)
let state = {
  drawn: [],
  last: null,
  currentPrize: 0
};
let isLocalChange = false; // Evita loop ao receber atualizações do Firebase

// =====================================================================
// ===== FIREBASE =====
// =====================================================================
async function saveState() {
  if (!window.firebaseAPI) return;
  try {
    await window.firebaseAPI.setDoc(
      window.firebaseAPI.bingoRef,
      {
        drawn: state.drawn,
        last: state.last,
        currentPrize: state.currentPrize,
        updatedAt: window.firebaseAPI.serverTimestamp()
      },
      { merge: true }
    );
  } catch (err) {
    console.error("Erro ao salvar no Firebase:", err);
  }
}

function setupFirebaseListener() {
  if (!window.firebaseAPI) {
    console.warn("Firebase não carregou. Operando offline.");
    setStatus("offline");
    return;
  }

  setStatus("loading");

  // Escuta mudanças em tempo real
  window.firebaseAPI.onSnapshot(
    window.firebaseAPI.bingoRef,
    (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        // Só aplica se não foi uma alteração feita por este próprio dispositivo
        if (!isLocalChange) {
          state.drawn = Array.isArray(data.drawn) ? data.drawn : [];
          state.last  = data.last ?? null;
          state.currentPrize = typeof data.currentPrize === 'number' ? data.currentPrize : 0;

          // Atualiza UI
          $('selPrize').value = state.currentPrize;
          render();
          updateRound();
        }
        isLocalChange = false;
        setStatus("online");
      } else {
        // Primeira vez: cria o documento
        saveState();
        setStatus("online");
      }
    },
    (err) => {
      console.error("Erro no listener:", err);
      setStatus("offline");
    }
  );
}

function setStatus(status) {
  const el = $('connStatus');
  if (!el) return;
  el.classList.remove('online','offline','loading');
  if (status === 'online')  { el.textContent = '● Conectado'; el.classList.add('online'); }
  if (status === 'offline') { el.textContent = '● Offline';   el.classList.add('offline'); }
  if (status === 'loading') { el.textContent = '● Conectando'; el.classList.add('loading'); }
}

// =====================================================================
// ===== FUNÇÕES DE AÇÃO =====
// =====================================================================
function registerNumber(n){
  if(state.drawn.includes(n)) return;
  isLocalChange = true;
  state.drawn.push(n);
  state.last = n;
  render();
  saveState();
  if(navigator.vibrate){ try{ navigator.vibrate(18); }catch(e){} }
}

function undoLast(){
  if(!state.drawn.length) return;
  isLocalChange = true;
  state.drawn.pop();
  state.last = state.drawn.length ? state.drawn[state.drawn.length-1] : null;
  render();
  saveState();
  if(navigator.vibrate){ try{ navigator.vibrate([10,40,10]); }catch(e){} }
}

// ===== INICIALIZAÇÃO =====
function init(){
  const sp = $('selPrize');
  prizes.forEach((p,i)=>{
    const o = document.createElement('option');
    o.value = i; o.textContent = (i+1) + '. ' + p.name;
    sp.appendChild(o);
  });

  $('logoBingoBox').innerHTML =
    LOGO_BINGO_URL ? `<img src="${escAttr(LOGO_BINGO_URL)}" alt="Bingo Mamma Mia!">` : LOGO_FALLBACK_SVG;

  buildGrid();
  buildScreenGrid();
  render();
  updateRound();
  bindModal();

  // Espera o Firebase carregar (vem de um <script type="module">)
  waitForFirebase().then(() => {
    setupFirebaseListener();
  });
}

function waitForFirebase(timeout = 10000) {
  return new Promise((resolve) => {
    const start = Date.now();
    const check = () => {
      if (window.firebaseAPI) return resolve();
      if (Date.now() - start > timeout) return resolve();
      setTimeout(check, 100);
    };
    check();
  });
}

function buildGrid(){
  const g = $('numGrid');
  const frag = document.createDocumentFragment();
  for(let c=0;c<5;c++){
    for(let n=ranges[c][0]; n<=ranges[c][1]; n++){
      const d = document.createElement('button');
      d.type = 'button';
      d.className = 'grid-cell';
      d.textContent = n;
      d.dataset.n = n;
      d.setAttribute('aria-label', 'Sortear número ' + n + ', letra ' + letters[c]);
      d.addEventListener('click', ()=> registerNumber(n));
      frag.appendChild(d);
    }
  }
  g.appendChild(frag);
}

function buildScreenGrid(){
  const g = $('scGrid');
  g.innerHTML = '';
  const frag = document.createDocumentFragment();
  for(let c=0;c<5;c++){
    for(let n=ranges[c][0]; n<=ranges[c][1]; n++){
      const d = document.createElement('div');
      d.className = 'sgCell'; d.dataset.sn = n; d.textContent = n;
      frag.appendChild(d);
    }
  }
  g.appendChild(frag);
}

// ===== MODAL NOVA RODADA =====
function bindModal(){
  $('modalCancel').addEventListener('click', closeModal);
  $('modalConfirm').addEventListener('click', ()=>{
    closeModal();
    isLocalChange = true;
    state.drawn = [];
    state.last = null;
    render();
    saveState();
  });
  $('modalBackdrop').addEventListener('click', e=>{
    if(e.target.id === 'modalBackdrop') closeModal();
  });
}
function newRound(){
  $('modalCount').textContent = state.drawn.length;
  $('modalBackdrop').classList.add('open');
  $('modalBackdrop').setAttribute('aria-hidden','false');
}
function closeModal(){
  $('modalBackdrop').classList.remove('open');
  $('modalBackdrop').setAttribute('aria-hidden','true');
}

// ===== ATUALIZAÇÃO DA RODADA =====
function updateRound(){
  const newPrize = +$('selPrize').value;
  // Só salva no Firebase se o valor realmente mudou
  if (newPrize !== state.currentPrize) {
    isLocalChange = true;
    state.currentPrize = newPrize;
    saveState();
  }
  renderPrize(newPrize);
}

function renderPrize(idx){
  const p = prizes[idx];
  const cartela = p.cartela || defaultCartela(idx);

  $('roundDisplay').textContent = p.name;
  $('mPrize').textContent = p.name;

  const box = $('scPrizeBanner');
  if(p.banner) box.innerHTML = `<img src="${escAttr(p.banner)}" alt="${escAttr(p.name)}">`;
  else         box.innerHTML = fallbackBannerSVG(p, idx, cartela);

  $('orgBannerPreview').src = p.banner || svgUri(fallbackBannerSVG(p, idx, cartela));
}

// ===== RENDER =====
function render(){
  const set = new Set(state.drawn);
  const last = state.last;

  document.querySelectorAll('#numGrid .grid-cell').forEach(b=>{
    const n = +b.dataset.n;
    const called = set.has(n);
    b.classList.toggle('called', called);
    b.classList.toggle('latest', n === last);
    b.setAttribute('aria-pressed', called ? 'true' : 'false');
  });

  document.querySelectorAll('#scGrid .sgCell').forEach(d=>{
    const n = +d.dataset.sn;
    d.classList.toggle('on', set.has(n));
    d.classList.toggle('latestNew', n === last);
  });

  const letraAtual = last ? letters[Math.ceil(last/15)-1] : '-';
  const numStr = last ? String(last).padStart(2,'0') : '--';

  const bb = $('lastBall');
  bb.classList.toggle('empty', !last);
  $('lastLetterBall').textContent = letraAtual;
  $('lastNumberBall').textContent = last || '-';
  $('drawnCount').textContent = state.drawn.length;

  const mb = $('mBall');
  mb.classList.toggle('empty', !last);
  $('mLetter').textContent = letraAtual;
  $('mNumber').textContent = last ? numStr : '--';
  $('mCount').textContent = state.drawn.length;

  $('scValue').textContent = last ? letraAtual + '-' + numStr : 'B-00';

  document.querySelectorAll('[data-undo]').forEach(b=>{ b.disabled = state.drawn.length === 0; });

  const h = $('history');
  h.innerHTML = '';
  if(!state.drawn.length){
    const hint = document.createElement('span');
    hint.className = 'empty-hint';
    hint.textContent = 'Nenhum número sorteado ainda.';
    h.appendChild(hint);
  } else {
    const frag = document.createDocumentFragment();
    [...state.drawn].reverse().forEach((n,i)=>{
      const s = document.createElement('span');
      s.textContent = letters[Math.ceil(n/15)-1] + n;
      if(i===0) s.classList.add('recent');
      frag.appendChild(s);
    });
    h.appendChild(frag);
  }

  if(last){ replayPop(bb); replayPop(mb); replayPop($('scCircle')); }
}

// ===== NAVEGAÇÃO =====
function setTab(t){
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.tab === t));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-' + t));
  if(t === 'screen'){
    const sp = $('panel-screen');
    if(sp) sp.scrollTop = 0;
  }
}

function setOrgView(v){
  const panel = $('panel-org');
  panel.dataset.view = v;
  document.querySelectorAll('.subtab').forEach(b=> b.classList.toggle('active', b.dataset.view === v));
  const pane = v === 'nums' ? document.querySelector('.org-right') : document.querySelector('.org-left');
  if(pane) pane.scrollTop = 0;
}

document.addEventListener('keydown', e=>{
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undoLast(); }
  if(e.key === 'Escape') closeModal();
});

document.addEventListener('dblclick', e=>{
  if(e.target.closest && e.target.closest('.grid-cell')) e.preventDefault();
}, { passive:false });

init();
</script>
